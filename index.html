.wl-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1rem; }

.wl-tab.active { background:#378ADD; border-color:#378ADD; color:#fff; }
.wl-section { display:none; }
.wl-section.active { display:block; }
.wl-cat-header { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; padding-bottom:6px; border-bottom:0.5px solid #e0dfd8; }
.wl-cat-name { font-size:13px; font-weight:500; }
.wl-cat-count { font-size:11px; color:#888780; }
.wl-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(148px,1fr)); gap:2px 8px; }
.wl-item { font-size:12px; padding:4px 0; display:flex; gap:6px; align-items:baseline; border-bottom:0.5px solid #f0efe8; }
.wl-num { font-size:10px; color:#b4b2a9; min-width:28px; flex-shrink:0; }
.wl-word { font-weight:500; color:#1a1a18; min-width:78px; flex-shrink:0; }
.wl-ja { color:#888780; font-size:11px; }
.quiz-header { margin-bottom:1.25rem; }
.quiz-title { font-size:20px; font-weight:500; }
.quiz-sub { font-size:13px; color:#6b6b68; margin-top:4px; }

.progress-fill { height:4px; background:#378ADD; border-radius:2px; transition:width 0.4s ease; }
.card { background:#fff; border:0.5px solid #e0dfd8; border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1rem; }
.q-num { font-size:11px; font-weight:500; color:#378ADD; letter-spacing:0.06em; margin-bottom:10px; }
.q-sentence { font-size:17px; font-weight:500; line-height:1.7; margin-bottom:6px; }
.blank { display:inline-block; border-bottom:2px solid #378ADD; min-width:90px; text-align:center; color:#378ADD; font-weight:500; padding:0 6px; }
.blank.correct { color:#3B6D11; border-color:#639922; }
.blank.wrong { color:#A32D2D; border-color:#E24B4A; }
.translation { font-size:13px; color:#6b6b68; margin-bottom:8px; line-height:1.5; }
.hint { font-size:12px; color:#888780; background:#f5f4f0; border-radius:6px; padding:6px 10px; margin-bottom:14px; line-height:1.6; }
.choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.choice-btn { background:#f5f4f0; border:0.5px solid #dddcd6; border-radius:8px; padding:10px 14px; font-size:14px; color:#1a1a18; cursor:pointer; text-align:left; transition:background 0.15s, border-color 0.15s; font-family:inherit; }
.choice-btn:hover:not(.disabled) { background:#fff; border-color:#b4b2a9; }
.choice-btn.correct { background:#EAF3DE; border-color:#639922; color:#3B6D11; cursor:default; }
.choice-btn.wrong { background:#FCEBEB; border-color:#E24B4A; color:#A32D2D; cursor:default; }
.choice-btn.disabled { cursor:default; }
.choice-btn.selected { background:#E8F0FD; border-color:#5B8DEF; color:#1a4fb5; font-weight:600; }
.feedback { display:none; font-size:13px; margin-top:12px; padding:8px 12px; border-radius:6px; line-height:1.7; }
.feedback.show { display:block; }
.feedback.correct { background:#EAF3DE; color:#3B6D11; }
.feedback.wrong { background:#FCEBEB; color:#A32D2D; }
.nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:1.5rem; }
.q-counter { font-size:13px; color:#6b6b68; }
.btn { background:transparent; border:0.5px solid #b4b2a9; border-radius:8px; padding:8px 18px; font-size:14px; color:#1a1a18; cursor:pointer; font-family:inherit; transition:background 0.15s; }
.btn:hover:not(:disabled) { background:#f5f4f0; }
.btn:disabled { opacity:0.3; cursor:default; }
.btn.primary { background:#378ADD; border-color:#378ADD; color:#fff; }
.btn.primary:hover:not(:disabled) { background:#185FA5; border-color:#185FA5; }
.result-card { background:#fff; border:0.5px solid #e0dfd8; border-radius:12px; padding:2rem 1.5rem; text-align:center; }
.score-big { font-size:52px; font-weight:500; color:#378ADD; line-height:1; }
.score-denom { font-size:22px; color:#b4b2a9; }
.score-pct { font-size:14px; color:#6b6b68; margin-top:6px; margin-bottom:1rem; }
.score-msg { font-size:14px; line-height:1.7; margin-bottom:1.5rem; }
.review-list { text-align:left; }
.review-item { padding:10px 0; border-top:0.5px solid #e0dfd8; font-size:13px; color:#6b6b68; line-height:1.7; }
.review-row { display:flex; align-items:flex-start; gap:8px; }
.mark { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; font-size:11px; font-weight:500; flex-shrink:0; margin-top:3px; }
.mark.ok { background:#EAF3DE; color:#3B6D11; }
.mark.ng { background:#FCEBEB; color:#A32D2D; }
.ans-correct { color:#3B6D11; font-weight:500; }
.ans-wrong { color:#A32D2D; }
.restart-btn { margin-top:1rem; padding:10px 24px; font-size:14px; }
.ss-title { font-size:20px; font-weight:500; margin-bottom:6px; }
.ss-sub { font-size:13px; color:#6b6b68; margin-bottom:1.5rem; }
.ss-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:1.5rem; }
.ss-btn { background:#fff; border:0.5px solid #dddcd6; border-radius:8px; padding:14px 0; font-size:16px; font-weight:500; color:#1a1a18; cursor:pointer; text-align:center; transition:all 0.15s; }
.ss-btn:hover { background:#EBF3FC; border-color:#378ADD; color:#378ADD; }
.ss-btn.sel { background:#378ADD; border-color:#378ADD; color:#fff; }
.ss-start { width:100%; padding:12px; font-size:15px; }
.loading-wrap { text-align:center; padding:3rem 1.5rem; }
.loading-spinner { display:inline-block; width:32px; height:32px; border:3px solid #dddcd6; border-top-color:#378ADD; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:12px; }

#admin-wrap { display:none; }
.adm-title { font-size:18px; font-weight:500; }

.adm-tbl td { padding:8px 10px; border:0.5px solid #e0dfd8; vertical-align:top; }

  </div>
  <div class="card">

      <button class="wl-tab active" onclick="setRange('all',this)">全範囲（1〜1900）</button>
      <button class="wl-tab" onclick="setRange('1-500',this)">第1部（1〜500）</button>
      <button class="wl-tab" onclick="setRange('501-1000',this)">第2部（501〜1000）</button>
      <button class="wl-tab" onclick="setRange('1001-1500',this)">第3部（1001〜1500）</button>
      <button class="wl-tab" onclick="setRange('1501-1900',this)">第4部（1501〜1900）</button>
    </div>
    <div class="ss-grid" id="ss-grid"></div>
    <button class="btn primary ss-start" id="ss-start-btn" onclick="startQuiz()" disabled>スタート →</button>
  </div>
  <div style="text-align:right;margin-top:10px;">
    <button style="background:none;border:none;color:#378ADD;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;" onclick="showAdmin()">管理者ページ</button>
  </div>
</div>

<!-- ★ クイズ画面 -->
<div id="quiz-wrap" class="wrap" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
    <span id="student-badge" style="font-size:13px;font-weight:500;color:#378ADD;"></span>
    <button style="background:none;border:none;font-size:12px;color:#888780;cursor:pointer;font-family:inherit;" onclick="backToSelect()">← 出席番号選択に戻る</button>
  </div>
  <div class="wordlist-toggle" onclick="toggleWordList()">
    <span><span class="wl-title">📚 単語リスト（英単語ターゲット1900）</span><span class="wl-count" id="wl-count"></span></span>
    <span class="wl-arrow" id="wl-arrow">▼</span>
  </div>
  <div class="wordlist-body" id="wordlist-body">
    <div class="wl-tabs" id="wl-tabs"></div>
    <div id="wl-sections"></div>
  </div>
  <div class="quiz-header">
    <div class="quiz-title">英語 穴埋め小テスト</div>
    <div class="quiz-sub">空欄に入る最も適切な語を選んでください・AIが毎回異なる例文を作成します</div>
  </div>
  <div class="progress-bg"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div id="quiz-body"></div>
  <div class="nav-row" id="nav-row" style="display:none;">
    <button class="btn" id="prev-btn" onclick="move(-1)" disabled>← 前へ</button>
    <span class="q-counter" id="q-counter">1 / 10</span>
    <button class="btn primary" id="next-btn" onclick="move(1)" disabled>次へ →</button>
  </div>
</div>

<!-- ★ 管理者画面 -->
<div id="admin-wrap" class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
    <span class="adm-title">📊 管理者ページ</span>
    <button class="btn" onclick="hideAdmin()">← 生徒画面に戻る</button>
  </div>
  <div id="adm-lock">
    <div style="font-size:13px;color:#6b6b68;margin-bottom:8px;">管理者パスワードを入力してください</div>
    <div class="adm-pass">
      <input type="password" id="adm-pass-inp" placeholder="パスワード" onkeydown="if(event.key==='Enter')unlockAdmin()">
      <button class="btn primary" onclick="unlockAdmin()">確認</button>
    </div>
    <div id="adm-err" style="font-size:12px;color:#A32D2D;display:none;">パスワードが違います</div>
  </div>
  <div id="adm-content" style="display:none;">
    <div class="adm-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;">
      <button class="btn" onclick="exportCSV()">📥 CSVダウンロード</button>
      <button class="btn" onclick="clearData()" style="color:#A32D2D;border-color:#E24B4A;">🗑 全データ削除</button>
    </div>
    <div style="overflow-x:auto;"><table class="adm-tbl" id="adm-tbl"></table></div>
  </div>
</div>

const QUIZ_SIZE = 10;
const ADM_PASS = "1234";
let studentNum = null;
let quizRange = 'all';

let answered = [];
let selected = [];
let shuffledChoices = [];

/* ===== レンジ選択 ===== */
function setRange(range, btn) {
  quizRange = range;
  document.querySelectorAll('#range-select .wl-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function getWordsByRange() {
  if (quizRange === '1-500') return WORDS.slice(0, 500);
  if (quizRange === '501-1000') return WORDS.slice(500, 1000);
  if (quizRange === '1001-1500') return WORDS.slice(1000, 1500);
  if (quizRange === '1501-1900') return WORDS.slice(1500);
  return WORDS;
}

/* ===== 出席番号 ===== */
function buildStudentSelect() {
  const grid = document.getElementById('ss-grid');
  for (let i = 1; i <= 40; i++) {
    const btn = document.createElement('button');
    btn.className = 'ss-btn';
    btn.textContent = i;
    btn.onclick = () => {
      document.querySelectorAll('.ss-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      studentNum = i;
      document.getElementById('ss-start-btn').disabled = false;
    };
    grid.appendChild(btn);
  }
}

/* ===== 単語リスト ===== */
function buildWordList() {
  document.getElementById('wl-count').textContent = '全' + WORDS.length + '語';
  const sections = [
    ['第1部（1〜500）', WORDS.slice(0,500), 0],
    ['第2部（501〜1000）', WORDS.slice(500,1000), 500],
    ['第3部（1001〜1500）', WORDS.slice(1000,1500), 1000],
    ['第4部（1501〜1900）', WORDS.slice(1500), 1500],
  ];
  const tabsEl = document.getElementById('wl-tabs');
  const secsEl = document.getElementById('wl-sections');
  tabsEl.innerHTML = '';
  secsEl.innerHTML = '';
  sections.forEach(([name, words, offset], idx) => {
    const tab = document.createElement('div');
    tab.className = 'wl-tab' + (idx===0?' active':'');
    tab.textContent = name;
    tab.onclick = () => {
      document.querySelectorAll('.wl-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.wl-section').forEach(s=>s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('wl-sec-'+idx).classList.add('active');
    };
    tabsEl.appendChild(tab);
    const sec = document.createElement('div');
    sec.className = 'wl-section' + (idx===0?' active':'');
    sec.id = 'wl-sec-'+idx;
    sec.innerHTML =
      '<div class="wl-cat-header"><span class="wl-cat-name">'+name+'</span><span class="wl-cat-count">'+words.length+'語</span></div>' +
      '<div class="wl-grid">' +
      words.map((w,i)=>`<div class="wl-item"><span class="wl-num">${offset+i+1}</span><span class="wl-word">${w[0]}</span><span class="wl-ja">${w[1]}</span></div>`).join('') +
      '</div>';
    secsEl.appendChild(sec);
  });
}

function toggleWordList() {
  document.getElementById('wordlist-body').classList.toggle('open');
  document.getElementById('wl-arrow').classList.toggle('open');
}

/* ===== シャッフル ===== */
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ===== API呼び出し ===== */
async function generateQuestions(words) {
  const wordInfo = words.map((w,i)=>`${i+1}. ${w[0]}（${w[1]}）`).join('\n');
  const prompt = `以下の英単語を使った穴埋め問題を${words.length}問作成してください。

条件：
・各英文は10語以内（必ず守ること）
・自然でわかりやすい英語の文
・空欄は対象単語が入る位置に配置（文頭でも可）
・日本語訳も付ける（短く明確に・15字以内目安）
・ひっかけ選択肢を3語選ぶ（同レベル英単語で品詞・文脈が近いもの）
・必ずJSON配列だけを返す（前後の説明・マークダウン記法一切不要）

単語：
${wordInfo}

出力形式（JSONのみ）：
[{"word":"対象単語","before":"空欄前の文","after":"空欄後の文","ja":"日本語訳","hint":"ヒント一言","distractors":["wrong1","wrong2","wrong3"]}]

注意：beforeとafterは空欄を合わせて10語以内になるよう調整。beforeかafterどちらかが空文字でも可。`;

  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 2500,
      messages: [{role:"user", content:prompt}]
    })
  });
  if (!resp.ok) throw new Error('API error ' + resp.status);
  const data = await resp.json();
  const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  const clean = text.replace(/```json\n?|```/g,"").trim();
  return JSON.parse(clean);
}

/* ===== クイズ開始 ===== */
async function startQuiz() {
  if (!studentNum) return;
  document.getElementById('ss-wrap').style.display = 'none';
  document.getElementById('quiz-wrap').style.display = 'block';
  document.getElementById('student-badge').textContent = `出席番号 ${studentNum}`;
  document.getElementById('nav-row').style.display = 'none';
  document.getElementById('prog').style.width = '0%';

  document.getElementById('quiz-body').innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="loading-wrap">
        <div class="loading-spinner"></div>
        <div style="font-size:16px;font-weight:500;margin-bottom:8px;">問題を生成中...</div>
        <div style="font-size:13px;color:#6b6b68;">AIが10問の例文を考えています。10〜20秒お待ちください。</div>
      </div>
    </div>`;

  buildWordList();

  try {
    const pool = getWordsByRange();
    quizWords = shuffle(pool).slice(0, QUIZ_SIZE);
    questions = await generateQuestions(quizWords);

    current = 0;
    answered = Array(QUIZ_SIZE).fill(false);
    selected = Array(QUIZ_SIZE).fill(null);
    shuffledChoices = questions.map((q,i)=> shuffle([quizWords[i][0], ...q.distractors]));

    document.getElementById('nav-row').style.display = 'flex';
    renderQuiz();
  } catch(e) {
    document.getElementById('quiz-body').innerHTML = `
      <div class="card">
        <div style="color:#A32D2D;font-size:14px;margin-bottom:12px;">⚠ 問題の生成に失敗しました。ネットワーク接続を確認して再度お試しください。</div>
        <button class="btn primary" onclick="startQuiz()">再試行</button>
        <button class="btn" onclick="backToSelect()" style="margin-left:8px;">戻る</button>
      </div>`;
  }
}

/* ===== クイズ描画 ===== */
function renderQuiz() {
  if (current >= QUIZ_SIZE) { showResult(); return; }
  const q = questions[current];
  const isAns = answered[current];
  const sel = selected[current];
  const correctWord = quizWords[current][0];

  const blankSpan = isAns
    ? `<span class="blank ${sel===correctWord?'correct':'wrong'}">${sel||'　　'}</span>`
    : (sel ? `<span class="blank">${sel}</span>` : `<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
  const sentence = (q.before||'') + blankSpan + (q.after||'');

  const choiceHTML = shuffledChoices[current].map(c => {
    let cls = 'choice-btn';
    if (isAns) {
      cls += ' disabled';
      if (c===correctWord) cls += ' correct';
      else if (c===sel) cls += ' wrong';
    } else if (c===sel) cls += ' selected';
    const safe = c.replace(/'/g,"&#39;");
    return `<button class="${cls}" onclick="choose('${safe}')">${c}</button>`;
  }).join('');

  let fbHTML = '';
  if (isAns) {
    const ok = sel===correctWord;
    fbHTML = `<div class="feedback show ${ok?'correct':'wrong'}">
      ${ok ? '✓ 正解！' : `✗ 不正解。正解は <strong>${correctWord}</strong>`}
      &nbsp;—&nbsp;${correctWord}: ${quizWords[current][1]}
    </div>`;
  }

  document.getElementById('quiz-body').innerHTML = `
    <div class="card">
      <div class="q-num">問題 ${current+1} / ${QUIZ_SIZE}</div>
      <div class="q-sentence">${sentence}</div>
      <div class="translation">🇯🇵 ${q.ja||''}</div>
      <div class="hint">💡 ${q.hint||correctWord}</div>
      <div class="choices">${choiceHTML}</div>
      ${fbHTML}
    </div>`;

  document.getElementById('prog').style.width = `${(current+1)/QUIZ_SIZE*100}%`;
  document.getElementById('q-counter').textContent = `${current+1} / ${QUIZ_SIZE}`;
  document.getElementById('prev-btn').disabled = current===0;
  document.getElementById('next-btn').disabled = !answered[current];
}

function choose(val) {
  if (answered[current]) return;
  selected[current] = val;
  answered[current] = true;
  renderQuiz();
  document.getElementById('next-btn').disabled = false;
}

function move(dir) {
  const next = current+dir;
  if (next<0) return;
  if (next>=QUIZ_SIZE) { showResult(); return; }
  current = next;
  renderQuiz();
}

/* ===== 結果 ===== */
function showResult() {
  let score = 0;
  questions.forEach((q,i)=>{ if(selected[i]===quizWords[i][0]) score++; });
  const pct = Math.round(score/QUIZ_SIZE*100);
  const msg = pct===100 ? '🎉 満点です！素晴らしい！全問正解、完璧です！'
    : pct>=80 ? '👏 よくできました！あと少しで満点です。'
    : pct>=60 ? '📚 まあまあです。間違えた問題をしっかり復習しましょう。'
    : '💪 もう一度チャレンジしてみましょう！解説を読んで復習してね。';

  const reviewH = questions.map((q,i) => {
    const ok = selected[i]===quizWords[i][0];
    const sent = (q.before||'')+'['+quizWords[i][0]+']'+(q.after||'');
    return `<div class="review-item"><div class="review-row">
      <span class="mark ${ok?'ok':'ng'}">${ok?'○':'×'}</span>
      <span><b>問${i+1}.</b> ${sent}
        ${!ok?`<span class="ans-wrong">（あなた: ${selected[i]||'未回答'}）</span>`:''}</span>
    </div></div>`;
  }).join('');

  document.getElementById('nav-row').style.display='none';
  document.getElementById('prog').style.width='100%';
  document.getElementById('quiz-body').innerHTML = `
    <div class="result-card">
      <div class="score-big">${score}<span class="score-denom"> / ${QUIZ_SIZE}</span></div>
      <div class="score-pct">正解率 ${pct}%</div>
      <div class="score-msg">${msg}</div>
      <div class="review-list">${reviewH}</div><br>
      <button class="btn primary restart-btn" onclick="startQuiz()">もう一度挑戦する（問題をランダムに変更）</button>
      <button class="btn restart-btn" onclick="backToSelect()" style="margin-left:8px;">出席番号選択に戻る</button>
    </div>`;

  saveResult(score, pct, questions.map((q,i)=>({
    word: quizWords[i][0],
    correct: selected[i]===quizWords[i][0],
    selected: selected[i]||'未回答'
  })));
}

function backToSelect() {
  document.getElementById('quiz-wrap').style.display='none';
  document.getElementById('admin-wrap').style.display='none';
  document.getElementById('ss-wrap').style.display='block';
}

/* ===== 成績保存 ===== */
function saveResult(score, pct, details) {
  try {
    const key = 'target1900_results';
    const all = JSON.parse(localStorage.getItem(key)||'[]');
    all.push({
      student: studentNum,
      score, pct,
      range: quizRange,
      date: new Date().toLocaleString('ja-JP'),
      wrong: details.filter(d=>!d.correct).map(d=>`${d.word}→${d.selected}`)
    });
    localStorage.setItem(key, JSON.stringify(all));
  } catch(e) {}
}

function renderAdminTable() {
  const all = JSON.parse(localStorage.getItem('target1900_results')||'[]');
  const byStudent = {};
  all.forEach(r => {
    if (!byStudent[r.student]) byStudent[r.student] = [];
    byStudent[r.student].push(r);
  });
  const tbl = document.getElementById('adm-tbl');
  if (!Object.keys(byStudent).length) {
    tbl.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888780;">データがありません</td></tr>';
    return;
  }
  tbl.innerHTML = `<thead><tr><th>出席番号</th><th>回数</th><th>平均正解率</th><th>最終実施</th><th>間違えた単語</th></tr></thead><tbody>` +
    Object.entries(byStudent).sort((a,b)=>a[0]-b[0]).map(([sn, records]) => {
      const avg = Math.round(records.reduce((s,r)=>s+r.pct,0)/records.length);
      const last = records[records.length-1];
      const wrongWords = [...new Set(records.flatMap(r=>r.wrong||[]))].slice(0,8).join('、');
      return `<tr><td><strong>${sn}</strong></td><td>${records.length}回</td>
        <td>${avg}%</td><td style="font-size:11px;">${last.date}</td>
        <td class="wrong-txt">${wrongWords||'なし'}</td></tr>`;
    }).join('') + '</tbody>';
}

function exportCSV() {
  const all = JSON.parse(localStorage.getItem('target1900_results')||'[]');
  if (!all.length) { alert('データがありません'); return; }
  const rows = [['出席番号','スコア','正解率(%)','範囲','実施日時','間違えた単語']];
  all.forEach(r => rows.push([r.student, r.score, r.pct, r.range||'全範囲', r.date, (r.wrong||[]).join(' / ')]));
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'target1900_quiz_results.csv';
  a.click();
}

function clearData() {
  if (confirm('全データを削除しますか？')) {
    localStorage.removeItem('target1900_results');
    renderAdminTable();
  }
}

/* ===== 初期化 ===== */
buildStudentSelect();
