<style>

.choice-btn:hover:not(.disabled) { background:#fff; border-color:#b4b2a9; }

.choice-btn.wrong { background:#FCEBEB; border-color:#E24B4A; color:#A32D2D; cursor:default; }

.choice-btn.selected { background:#E8F0FD; border-color:#5B8DEF; color:#1a4fb5; font-weight:600; }

.input-row { display:flex; gap:8px; margin-top:16px; align-items:center; }

.answer-input:focus { border-color:#378ADD; box-shadow:0 0 0 3px rgba(55,138,221,0.12); }
.answer-input:disabled { background:#f5f4f0; color:#888780; }
.submit-btn { white-space:nowrap; padding:10px 18px; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)} }
.shake { animation:shake 0.35s ease; border-color:#E24B4A !important; }
.feedback { display:none; font-size:13px; margin-top:12px; padding:8px 12px; border-radius:6px; line-height:1.7; }
.feedback.show { display:block; }
.feedback.correct { background:#EAF3DE; color:#3B6D11; }
.feedback.wrong { background:#FCEBEB; color:#A32D2D; }
.nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:1.5rem; }
.q-counter { font-size:13px; color:#6b6b68; }
.btn { background:transparent; border:0.5px solid #b4b2a9; border-radius:8px; padding:8px 18px; font-size:14px; color:#1a1a18; cursor:pointer; font-family:inherit; transition:background 0.15s; }
.btn:hover:not(:disabled) { background:#f5f4f0; }
.btn:disabled { opacity:0.3; cursor:default; }
.btn.primary { background:#378ADD; border-color:#378ADD; color:#fff; }
.btn.primary:hover:not(:disabled) { background:#185FA5; border-color:#185FA5; }
.result-card { background:#fff; border:0.5px solid #e0dfd8; border-radius:12px; padding:2rem 1.5rem; text-align:center; }
.score-big { font-size:52px; font-weight:500; color:#378ADD; line-height:1; }
.score-denom { font-size:22px; color:#b4b2a9; }
.score-pct { font-size:14px; color:#6b6b68; margin-top:6px; margin-bottom:1rem; }
.score-msg { font-size:14px; line-height:1.7; margin-bottom:1.5rem; }
.review-list { text-align:left; }
.review-item { padding:10px 0; border-top:0.5px solid #e0dfd8; font-size:13px; color:#6b6b68; line-height:1.7; }
.review-row { display:flex; align-items:flex-start; gap:8px; }
.mark { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; font-size:11px; font-weight:500; flex-shrink:0; margin-top:3px; }
.mark.ok { background:#EAF3DE; color:#3B6D11; }
.mark.ng { background:#FCEBEB; color:#A32D2D; }
.ans-correct { color:#3B6D11; font-weight:500; }
.ans-wrong { color:#A32D2D; }
.restart-btn { margin-top:1rem; padding:10px 24px; font-size:14px; }
.ss-title { font-size:20px; font-weight:500; margin-bottom:6px; }
.ss-sub { font-size:13px; color:#6b6b68; margin-bottom:1.5rem; }

.ss-btn { background:#fff; border:0.5px solid #dddcd6; border-radius:8px; padding:14px 0; font-size:16px; font-weight:500; color:#1a1a18; cursor:pointer; text-align:center; transition:all 0.15s; }
.ss-btn:hover { background:#EBF3FC; border-color:#378ADD; color:#378ADD; }
.ss-btn.sel { background:#378ADD; border-color:#378ADD; color:#fff; }
.ss-start { width:100%; padding:12px; font-size:15px; }
.loading-wrap { text-align:center; padding:3rem 1.5rem; }
.loading-spinner { display:inline-block; width:32px; height:32px; border:3px solid #dddcd6; border-top-color:#378ADD; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:12px; }

#admin-wrap { display:none; }
.adm-title { font-size:18px; font-weight:500; }
.adm-pass { display:flex; gap:8px; margin-bottom:1rem; }
.adm-pass input { flex:1; border:0.5px solid #dddcd6; border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; outline:none; }

.step-label { font-size:11px; font-weight:600; color:#888780; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px; }
.grade-row { display:flex; gap:8px; margin-bottom:16px; }
.grade-btn { flex:1; background:#fff; border:0.5px solid #dddcd6; border-radius:8px; padding:13px 0; font-size:17px; font-weight:600; color:#1a1a18; cursor:pointer; text-align:center; transition:all 0.15s; }
.grade-btn:hover { background:#EBF3FC; border-color:#378ADD; color:#378ADD; }
.grade-btn.sel { background:#378ADD; border-color:#378ADD; color:#fff; }
.class-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
.class-btn { background:#fff; border:0.5px solid #dddcd6; border-radius:8px; padding:10px 0; font-size:14px; font-weight:500; color:#1a1a18; cursor:pointer; text-align:center; transition:all 0.15s; }

.class-btn.sel { background:#378ADD; border-color:#378ADD; color:#fff; }
.step-block { margin-bottom:0; }

<!-- ★ 出席番号選択 -->
<div id="ss-wrap" class="wrap">
  <div class="quiz-header">
    <div class="ss-title">英語 穴埋め小テスト</div>
    <div class="ss-sub">学年・組・出席番号を選んでスタートしてください<br><span style="font-size:11px;color:#888780;">📖 英単語ターゲット1900（6訂版）全1900語より出題</span></div>
  </div>
  <div class="card">
    <!-- 出題範囲 -->
    <div class="step-block">
      <div class="step-label">📚 出題範囲</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;" id="range-select">
        <button class="wl-tab active" onclick="setRange('all',this)">全範囲（1〜1900）</button>
        <button class="wl-tab" onclick="setRange('1-500',this)">第1部（1〜500）</button>
        <button class="wl-tab" onclick="setRange('501-1000',this)">第2部（501〜1000）</button>
        <button class="wl-tab" onclick="setRange('1001-1500',this)">第3部（1001〜1500）</button>
        <button class="wl-tab" onclick="setRange('1501-1900',this)">第4部（1501〜1900）</button>
      </div>
    </div>
    <!-- 学年 -->
    <div class="step-block" style="margin-top:18px;border-top:0.5px solid #f0efe8;padding-top:18px;">
      <div class="step-label">① 学年</div>
      <div class="grade-row">
        <button class="grade-btn" onclick="selectGrade(1,this)">1年</button>
        <button class="grade-btn" onclick="selectGrade(2,this)">2年</button>
        <button class="grade-btn" onclick="selectGrade(3,this)">3年</button>
      </div>
    </div>
    <!-- 組 -->
    <div class="step-block" id="class-block" style="margin-top:18px;border-top:0.5px solid #f0efe8;padding-top:18px;">
      <div class="step-label">② 組</div>
      <div class="class-row" id="class-grid">
        <button class="class-btn" onclick="selectClass('01',this)">01組</button>
        <button class="class-btn" onclick="selectClass('02',this)">02組</button>
        <button class="class-btn" onclick="selectClass('03',this)">03組</button>
        <button class="class-btn" onclick="selectClass('04',this)">04組</button>
        <button class="class-btn" onclick="selectClass('05',this)">05組</button>
        <button class="class-btn" onclick="selectClass('06',this)">06組</button>
        <button class="class-btn" onclick="selectClass('07',this)">07組</button>
        <button class="class-btn" onclick="selectClass('08',this)">08組</button>
      </div>
    </div>
    <!-- 出席番号 -->
    <div class="step-block" id="num-block" style="margin-top:18px;border-top:0.5px solid #f0efe8;padding-top:18px;">
      <div class="step-label">③ 出席番号</div>
      <div class="ss-grid" id="ss-grid"></div>
    </div>
    <button class="btn primary ss-start" id="ss-start-btn" onclick="startQuiz()" disabled style="width:100%;padding:12px;font-size:15px;margin-top:18px;">スタート →</button>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
    <button style="background:none;border:none;color:#378ADD;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;" onclick="showAdmin()">管理者ページ</button>
  </div>
</div>

<!-- ★ クイズ画面 -->
<div id="quiz-wrap" class="wrap" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
    <span id="student-badge" style="font-size:13px;font-weight:500;color:#378ADD;"></span>
    <button style="background:none;border:none;font-size:12px;color:#888780;cursor:pointer;font-family:inherit;" onclick="backToSelect()">← 出席番号選択に戻る</button>
  </div>
  <div class="wordlist-toggle" onclick="toggleWordList()">
    <span><span class="wl-title">📚 単語リスト（英単語ターゲット1900）</span><span class="wl-count" id="wl-count"></span></span>
    <span class="wl-arrow" id="wl-arrow">▼</span>
  </div>
  <div class="wordlist-body" id="wordlist-body">
    <div class="wl-tabs" id="wl-tabs"></div>
    <div id="wl-sections"></div>
  </div>
  <div class="quiz-header">
    <div class="quiz-title">英語 穴埋め小テスト</div>
    <div class="quiz-sub">空欄に入る最も適切な語を選んでください・AIが毎回異なる例文を作成します</div>
  </div>
  <div class="progress-bg"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div id="quiz-body"></div>
  <div class="nav-row" id="nav-row" style="display:none;">
    <button class="btn" id="prev-btn" onclick="move(-1)" disabled>← 前へ</button>
    <span class="q-counter" id="q-counter">1 / 10</span>
    <button class="btn primary" id="next-btn" onclick="move(1)" disabled>次へ →</button>
  </div>
</div>

<!-- ★ 管理者画面 -->
<div id="admin-wrap" class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
    <span class="adm-title">📊 管理者ページ</span>
    <button class="btn" onclick="hideAdmin()">← 生徒画面に戻る</button>
  </div>
  <div id="adm-lock">
    <div style="font-size:13px;color:#6b6b68;margin-bottom:8px;">管理者パスワードを入力してください</div>
    <div class="adm-pass">
      <input type="password" id="adm-pass-inp" placeholder="パスワード" onkeydown="if(event.key==='Enter')unlockAdmin()">
      <button class="btn primary" onclick="unlockAdmin()">確認</button>
    </div>
    <div id="adm-err" style="font-size:12px;color:#A32D2D;display:none;">パスワードが違います</div>
  </div>
  <div id="adm-content" style="display:none;">
    <div class="adm-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;">
      <button class="btn" onclick="exportCSV()">📥 CSVダウンロード</button>
      <button class="btn" onclick="clearData()" style="color:#A32D2D;border-color:#E24B4A;">🗑 全データ削除</button>
    </div>
    <div style="overflow-x:auto;"><table class="adm-tbl" id="adm-tbl"></table></div>
  </div>
</div>

const QUIZ_SIZE = 10;
const ADM_PASS = "1234";
let grade = null;       // 1, 2, 3
let className = null;   // '01'〜'08'
let studentNum = null;
let quizRange = 'all';
let quizWords = [];
let questions = [];
let current = 0;
let answered = [];
let selected = [];
let shuffledChoices = [];

/* ===== レンジ選択 ===== */
function setRange(range, btn) {
  quizRange = range;
  document.querySelectorAll('#range-select .wl-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function getWordsByRange() {
  if (quizRange === '1-500') return WORDS.slice(0, 500);
  if (quizRange === '501-1000') return WORDS.slice(500, 1000);
  if (quizRange === '1001-1500') return WORDS.slice(1000, 1500);
  if (quizRange === '1501-1900') return WORDS.slice(1500);
  return WORDS;
}

/* ===== 学年・組・出席番号 ===== */
function selectGrade(g, btn) {
  grade = g;
  className = null;
  studentNum = null;
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  // 組・出席番号の選択をリセット
  document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('sel'));
  document.querySelectorAll('.ss-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('ss-start-btn').disabled = true;
}

function selectClass(c, btn) {
  className = c;
  studentNum = null;
  document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  document.querySelectorAll('.ss-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('ss-start-btn').disabled = true;
}

function buildStudentSelect() {
  const grid = document.getElementById('ss-grid');
  for (let i = 1; i <= 40; i++) {
    const btn = document.createElement('button');
    btn.className = 'ss-btn';
    btn.textContent = i;
    btn.onclick = () => {
      if (!grade || !className) return;
      document.querySelectorAll('.ss-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      studentNum = i;
      document.getElementById('ss-start-btn').disabled = false;
    };
    grid.appendChild(btn);
  }
}

/* ===== 単語リスト ===== */
function buildWordList() {
  document.getElementById('wl-count').textContent = '全' + WORDS.length + '語';
  const sections = [
    ['第1部（1〜500）', WORDS.slice(0,500), 0],
    ['第2部（501〜1000）', WORDS.slice(500,1000), 500],
    ['第3部（1001〜1500）', WORDS.slice(1000,1500), 1000],
    ['第4部（1501〜1900）', WORDS.slice(1500), 1500],
  ];
  const tabsEl = document.getElementById('wl-tabs');
  const secsEl = document.getElementById('wl-sections');
  tabsEl.innerHTML = '';
  secsEl.innerHTML = '';
  sections.forEach(([name, words, offset], idx) => {
    const tab = document.createElement('div');
    tab.className = 'wl-tab' + (idx===0?' active':'');
    tab.textContent = name;
    tab.onclick = () => {
      document.querySelectorAll('.wl-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.wl-section').forEach(s=>s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('wl-sec-'+idx).classList.add('active');
    };
    tabsEl.appendChild(tab);
    const sec = document.createElement('div');
    sec.className = 'wl-section' + (idx===0?' active':'');
    sec.id = 'wl-sec-'+idx;
    sec.innerHTML =
      '<div class="wl-cat-header"><span class="wl-cat-name">'+name+'</span><span class="wl-cat-count">'+words.length+'語</span></div>' +
      '<div class="wl-grid">' +
      words.map((w,i)=>`<div class="wl-item"><span class="wl-num">${offset+i+1}</span><span class="wl-word">${w[0]}</span><span class="wl-ja">${w[1]}</span></div>`).join('') +
      '</div>';
    secsEl.appendChild(sec);
  });
}

function toggleWordList() {
  document.getElementById('wordlist-body').classList.toggle('open');
  document.getElementById('wl-arrow').classList.toggle('open');
}

/* ===== シャッフル ===== */
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ===== 静的問題生成（穴埋め形式） ===== */
function generateStaticQuestions(targetWords, pool) {
  return targetWords.map(w => {
    const word = w[0], meaning = w[1];
    const sent = SENTENCES[word];
    let before, after, distractors;
    if (sent) {
      before = sent.b; after = sent.a; distractors = sent.d;
    } else {
      // フォールバック：意味の4択
      before = ''; after = ''; distractors = [];
    }
    // distractor が不足する場合はプールから補充
    const used = new Set([word, ...distractors]);
    const extra = shuffle(pool.filter(x => !used.has(x[0]))).slice(0, 3 - distractors.length);
    distractors = [...distractors, ...extra.map(x => x[0])];
    return {
      word, meaning, before, after,
      answer: word,
      choices: shuffle([word, ...distractors.slice(0,3)])
    };
  });
}

/* ===== クイズ開始 ===== */
function startQuiz() {
  if (!grade || !className || !studentNum) return;
  document.getElementById('ss-wrap').style.display = 'none';
  document.getElementById('quiz-wrap').style.display = 'block';
  document.getElementById('student-badge').textContent = `${grade}年${className}組 ${studentNum}番`;

  const pool = getWordsByRange();
  quizWords = shuffle([...pool]).slice(0, QUIZ_SIZE);
  questions = generateStaticQuestions(quizWords, pool);

  current = 0;
  answered = Array(QUIZ_SIZE).fill(false);
  selected = Array(QUIZ_SIZE).fill(null);

  buildWordList();
  document.getElementById('nav-row').style.display = 'flex';
  document.getElementById('prog').style.width = `${1/QUIZ_SIZE*100}%`;
  renderQuiz();
}

/* ===== クイズ描画（自由入力形式） ===== */
function renderQuiz() {
  if (current >= QUIZ_SIZE) { showResult(); return; }
  const q = questions[current];
  const isAns = answered[current];
  const sel = selected[current];
  const ok = isAns && (sel||'').toLowerCase().trim() === q.answer.toLowerCase();

  // 空欄部分
  let blankSpan;
  if (!isAns) {
    blankSpan = `<span class="blank" style="min-width:110px;display:inline-block;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
  } else {
    blankSpan = `<span class="blank ${ok?'correct':'wrong'}">${sel||'？'}</span>`;
  }
  const sentenceHTML = (q.before||'') + blankSpan + (q.after||'');

  // 入力エリア or フィードバック
  let bottomHTML;
  if (!isAns) {
    bottomHTML = `
      <div class="input-row">
        <input type="text" id="answer-input" class="answer-input"
               placeholder="英単語を入力..." autocomplete="off" autocorrect="off"
               spellcheck="false"
               onkeydown="if(event.key==='Enter')submitAnswer()">
        <button class="btn primary submit-btn" onclick="submitAnswer()">確認する</button>
      </div>
      <div style="font-size:11px;color:#b4b2a9;margin-top:8px;">Enter キーでも送信できます</div>`;
  } else {
    const fullSent = (q.before||'') + `<strong style="color:${ok?'#3B6D11':'#378ADD'}">${q.answer}</strong>` + (q.after||'');
    bottomHTML = `
      <div class="feedback show ${ok?'correct':'wrong'}">
        ${ok
          ? '✓ 正解！'
          : `✗ 不正解。&nbsp;あなたの回答：<em>${sel||'（未入力）'}</em>&nbsp;→&nbsp;正解：<strong>${q.answer}</strong>`}
        <div style="margin-top:8px;font-size:13px;line-height:1.8;">${fullSent}</div>
        <div style="margin-top:4px;font-size:12px;opacity:0.75;">${q.word}：${q.meaning}</div>
      </div>`;
  }

  document.getElementById('quiz-body').innerHTML = `
    <div class="card">
      <div class="q-num">問題 ${current+1} / ${QUIZ_SIZE}</div>
      <div class="q-prompt" style="font-size:13px;color:#6b6b68;margin-bottom:12px;">空欄に入る英単語を入力してください</div>
      <div class="q-sentence">${sentenceHTML}</div>
      ${bottomHTML}
    </div>`;

  if (!isAns) {
    setTimeout(() => { const el = document.getElementById('answer-input'); if(el) el.focus(); }, 30);
  }

  document.getElementById('prog').style.width = `${(current+1)/QUIZ_SIZE*100}%`;
  document.getElementById('q-counter').textContent = `${current+1} / ${QUIZ_SIZE}`;
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = !answered[current];
}

function submitAnswer() {
  if (answered[current]) return;
  const inp = document.getElementById('answer-input');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) {
    inp.classList.add('shake');
    setTimeout(() => inp.classList.remove('shake'), 400);
    inp.focus();
    return;
  }
  selected[current] = val;
  answered[current] = true;
  renderQuiz();
  document.getElementById('next-btn').disabled = false;
}

function move(dir) {
  const next = current+dir;
  if (next<0) return;
  if (next>=QUIZ_SIZE) { showResult(); return; }
  current = next;
  renderQuiz();
}

/* ===== 結果 ===== */
function showResult() {
  let score = 0;
  const isCorrect = (i) => (selected[i]||'').toLowerCase().trim() === questions[i].answer.toLowerCase();
  questions.forEach((_,i)=>{ if(isCorrect(i)) score++; });
  const pct = Math.round(score/QUIZ_SIZE*100);
  const msg = pct===100 ? '🎉 満点です！素晴らしい！全問正解、完璧です！'
    : pct>=80 ? '👏 よくできました！あと少しで満点です。'
    : pct>=60 ? '📚 まあまあです。間違えた問題をしっかり復習しましょう。'
    : '💪 もう一度チャレンジしてみましょう！解説を読んで復習してね。';

  const reviewH = questions.map((q,i) => {
    const ok = isCorrect(i);
    const fullSent = (q.before||'') + '[' + q.answer + ']' + (q.after||'');
    return `<div class="review-item"><div class="review-row">
      <span class="mark ${ok?'ok':'ng'}">${ok?'○':'×'}</span>
      <span><b>問${i+1}.</b> ${fullSent}
        ${!ok?`<span class="ans-wrong">（あなた: ${selected[i]||'未回答'}）</span>`:''}
        <br><span style="font-size:11px;color:#888780;">${q.word}：${q.meaning}</span>
      </span>
    </div></div>`;
  }).join('');

  document.getElementById('nav-row').style.display='none';
  document.getElementById('prog').style.width='100%';
  document.getElementById('quiz-body').innerHTML = `
    <div class="result-card">
      <div class="score-big">${score}<span class="score-denom"> / ${QUIZ_SIZE}</span></div>
      <div class="score-pct">正解率 ${pct}%</div>
      <div class="score-msg">${msg}</div>
      <div class="review-list">${reviewH}</div><br>
      <button class="btn primary restart-btn" onclick="startQuiz()">もう一度挑戦する（問題をランダムに変更）</button>
      <button class="btn restart-btn" onclick="backToSelect()" style="margin-left:8px;">出席番号選択に戻る</button>
    </div>`;

  saveResult(score, pct, questions.map((q,i)=>({
    word: q.word,
    correct: isCorrect(i),
    selected: selected[i]||'未回答'
  })));
}

function backToSelect() {
  document.getElementById('quiz-wrap').style.display='none';
  document.getElementById('admin-wrap').style.display='none';
  document.getElementById('ss-wrap').style.display='block';
}

/* ===== 成績保存 ===== */
function saveResult(score, pct, details) {
  try {
    const key = 'target1900_results';
    const all = JSON.parse(localStorage.getItem(key)||'[]');
    all.push({
      grade, className,
      student: studentNum,
      label: `${grade}年${className}組${String(studentNum).padStart(2,'0')}番`,
      score, pct,
      range: quizRange,
      date: new Date().toLocaleString('ja-JP'),
      wrong: details.filter(d=>!d.correct).map(d=>`${d.word}→${d.selected}`)
    });
    localStorage.setItem(key, JSON.stringify(all));
  } catch(e) {}
}

function renderAdminTable() {
  const all = JSON.parse(localStorage.getItem('target1900_results')||'[]');
  const byKey = {};
  all.forEach(r => {
    const k = r.label || `${r.grade||'?'}年${r.className||'?'}組${String(r.student).padStart(2,'0')}番`;
    if (!byKey[k]) byKey[k] = [];
    byKey[k].push(r);
  });
  const tbl = document.getElementById('adm-tbl');
  if (!Object.keys(byKey).length) {
    tbl.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888780;padding:1.5rem;">データがありません</td></tr>';
    return;
  }
  tbl.innerHTML = `<thead><tr><th>生徒</th><th>回数</th><th>平均正解率</th><th>最終実施</th><th>間違えた単語</th></tr></thead><tbody>` +
    Object.entries(byKey).sort((a,b)=>a[0]<b[0]?-1:1).map(([label, records]) => {
      const avg = Math.round(records.reduce((s,r)=>s+r.pct,0)/records.length);
      const last = records[records.length-1];
      const wrongWords = [...new Set(records.flatMap(r=>r.wrong||[]))].slice(0,8).join('、');
      return `<tr><td><strong>${label}</strong></td><td>${records.length}回</td>
        <td>${avg}%</td><td style="font-size:11px;">${last.date}</td>
        <td class="wrong-txt">${wrongWords||'なし'}</td></tr>`;
    }).join('') + '</tbody>';
}

function exportCSV() {
  const all = JSON.parse(localStorage.getItem('target1900_results')||'[]');
  if (!all.length) { alert('データがありません'); return; }
  const rows = [['生徒','学年','組','出席番号','スコア','正解率(%)','範囲','実施日時','間違えた単語']];
  all.forEach(r => {
    const label = r.label || `${r.grade||''}年${r.className||''}組${r.student}番`;
    rows.push([label, r.grade||'', r.className||'', r.student, r.score, r.pct, r.range||'全範囲', r.date, (r.wrong||[]).join(' / ')]);
  });
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'target1900_quiz_results.csv';
  a.click();
}

function clearData() {
  if (confirm('全データを削除しますか？')) {
    localStorage.removeItem('target1900_results');
    renderAdminTable();
  }
}

buildStudentSelect();
